# Deploys the application: checks, tests, the api function to Supabase, the web to Cloudflare Pages.
# Runs on every push to main and by hand. Database migrations are NOT applied here (see migrace.yml).
name: Nasazení

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: nasazeni
  cancel-in-progress: false

permissions:
  contents: read

env:
  PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'a4m-lead-management' }}

jobs:
  nasazeni:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund

      - name: Kontrola nastavení
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          ALLOWED_EMAILS: ${{ secrets.ALLOWED_EMAILS }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          for name in SUPABASE_PROJECT_REF SUPABASE_ANON_KEY SUPABASE_ACCESS_TOKEN ALLOWED_EMAILS CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!name}" ]; then echo "::error::Chybí tajemství $name (Settings → Secrets and variables → Actions)"; missing=1; fi
          done
          exit $missing

      - run: npm run check
      - run: npm test

      - name: Sestavení
        env:
          VITE_SUPABASE_URL: https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: npm run build

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Serverová funkce api
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          ALLOWED_EMAILS: ${{ secrets.ALLOWED_EMAILS }}
          # The web address of the application; more addresses (own domain) go to the variable APP_ORIGINS.
          ALLOWED_ORIGINS: https://${{ env.PAGES_PROJECT }}.pages.dev ${{ vars.APP_ORIGINS }}
        run: |
          supabase secrets set --project-ref "$PROJECT_REF" "ALLOWED_EMAILS=$ALLOWED_EMAILS" "ALLOWED_ORIGINS=$ALLOWED_ORIGINS" > /dev/null
          supabase functions deploy api --project-ref "$PROJECT_REF"

      - name: Nastavení přihlášení (registrace vypnutá, 2FA zapnuté)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          status=$(curl -sS -o /dev/null -w '%{http_code}' -X PATCH "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' \
            -d "{\"disable_signup\":true,\"mfa_totp_enroll_enabled\":true,\"mfa_totp_verify_enabled\":true,\"password_min_length\":12,\"site_url\":\"https://$PAGES_PROJECT.pages.dev\"}")
          echo "Odpověď Supabase: $status"
          if [ "$status" != "200" ]; then echo "::error::Nastavení přihlášení se nepodařilo zapsat. Zkontrolujte ho ručně podle docs/03-ostry-provoz.md."; exit 1; fi

      - name: Web na Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages project create "$PAGES_PROJECT" --production-branch main > /dev/null 2>&1 || true
          npx --yes wrangler@4 pages deploy build.nosync --project-name "$PAGES_PROJECT" --branch main --commit-dirty=true
