# Database changes (supabase/migrations) are applied by hand: first run it as a preview, read what
# would change, then run it again with "zapsat" ticked.
name: Migrace databáze

on:
  workflow_dispatch:
    inputs:
      zapsat:
        description: 'Zapsat změny do databáze (bez zaškrtnutí jen náhled)'
        type: boolean
        default: false

concurrency:
  group: migrace
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase link --yes --project-ref "$PROJECT_REF"
      - name: Náhled (co by se změnilo)
        run: supabase db push --dry-run --yes
      - name: Zápis
        if: ${{ inputs.zapsat }}
        run: supabase db push --yes
